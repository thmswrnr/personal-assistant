services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: core_harness
    # Run as the unprivileged "node" user (uid 1000) so files the agent creates in the
    # mounted volumes are owned by the host user, not root.
    user: "node"
    volumes:
      - ./data/pi:/app/.pi:rw
      - ./data/storage:/app/storage:rw
      - ./data/secrets:/app/secrets:rw
      # The skills already arrive with the .pi mount above. Re-mount them read-only so the
      # agent cannot edit its own tracked skill packages (it writes to storage/custom_skills).
      - ./data/pi/skills:/app/.pi/skills:ro
    env_file:
      - .env
    # Reach a model server running on the HOST (e.g. the local-llama repo on :8080). Linux
    # doesn't provide host.docker.internal by default; host-gateway maps it to the bridge
    # gateway. Harmless when you only use a hosted API.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Use the mounted .pi dir as pi's config dir (models.json, SYSTEM.md, skills/).
      # The model is an external OpenAI-compatible API configured in data/pi/models.json +
      # data/pi/settings.json (key via LLM_API_KEY in .env) — no local model service required.
      - PI_CODING_AGENT_DIR=/app/.pi
      # Local timezone, so dates and times Core reports are local. Change as needed.
      - TZ=Europe/Berlin
    # Core does nothing on its own — it acts only when asked. So the main process is just a
    # keep-alive: it holds the container open as a warm shell that `core.sh` (and any future
    # service on this box) enters with `docker exec pi …`.
    command: ["sleep", "infinity"]
    # Come back after a reboot or a crash — Core is meant to be reachable 24/7. "unless-stopped"
    # (not "always") so a deliberate `docker compose stop` stays stopped.
    restart: unless-stopped
    networks:
      - core_network

  searxng:
    # Self-hosted metasearch for the websearch skill. Internal-only (no host port) —
    # reachable by core/ui at http://searxng:8080. Pinned by digest for reproducibility.
    # No own index: it aggregates upstream engines and exposes a private JSON API.
    image: searxng/searxng@sha256:8f1e32b1013b1e74a9b769686edbca03ff5439395743725f3f18369b4841f709
    container_name: core_searxng
    volumes:
      # settings.yml enables the JSON API; the secret comes from SEARXNG_SECRET (.env).
      # Mount the FILE, read-only — not the directory. The entrypoint chowns any writable
      # config dir to its own uid, which then locks the host user out of their own tracked
      # file (a plain `git checkout` of it fails). settings.yml is the only thing SearXNG
      # writes here, and it doesn't need to.
      - ./data/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (openssl rand -hex 32)}
      - SEARXNG_BASE_URL=http://searxng:8080/
    restart: unless-stopped
    networks:
      - core_network

  homeassistant:
    # Home automation. Only starts under the "home" profile, so a dev box without the Zigbee
    # stick still runs `docker compose up -d` unchanged. On the Pi:
    #   docker compose --profile home up -d
    profiles: ["home"]
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: core_homeassistant
    # Host networking, so HA can discover devices on the LAN (mDNS/SSDP need broadcast traffic,
    # which a bridge network drops). Side effect: the UI is on the host's :8123 directly, and HA
    # reaches core_bridge at 127.0.0.1:11434 rather than by container name.
    network_mode: host
    # HA manages the radio and mounts/unmounts USB devices; it expects to run privileged.
    privileged: true
    volumes:
      - ./data/homeassistant:/config
    devices:
      # The Zigbee stick. Set ZIGBEE_DEVICE in .env to the stable by-id path — NOT /dev/ttyUSB0,
      # which is assigned in plug order and moves between boots. Find it with:
      #   ls -l /dev/serial/by-id/
      # The default is a deliberately non-existent path: compose interpolates every service
      # before it filters profiles, so a `:?` here would break `docker compose up` on a machine
      # that never starts this service. Leaving it unset instead fails at container start, with
      # the missing device's name saying what went wrong.
      - ${ZIGBEE_DEVICE:-/dev/zigbee-device-not-set-in-env}:/dev/ttyUSB0
    environment:
      # Same local timezone as core, so automations and Core agree on what "today" means.
      - TZ=Europe/Berlin
    restart: unless-stopped

networks:
  core_network:
    driver: bridge
